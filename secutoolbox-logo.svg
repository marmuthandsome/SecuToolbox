<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1526;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A8D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E5B0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2540" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.5"/>

  <!-- Ambient glow -->
  <ellipse cx="640" cy="360" rx="380" ry="220" fill="#00C896" opacity="0.04"/>

  <!-- TOOLBOX BODY -->
  <rect x="490" y="300" width="300" height="200" rx="14" ry="14"
        fill="none" stroke="url(#boxGrad)" stroke-width="3" filter="url(#glow)"/>
  <rect x="491" y="301" width="298" height="198" rx="13" ry="13"
        fill="#0B1A30" opacity="0.8"/>

  <!-- TOOLBOX HANDLE -->
  <path d="M 570 300 L 570 272 Q 570 256 588 256 L 692 256 Q 710 256 710 272 L 710 300"
        fill="none" stroke="url(#boxGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- DIVIDER LINE -->
  <line x1="490" y1="353" x2="790" y2="353"
        stroke="url(#boxGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- LATCH -->
  <rect x="620" y="344" width="40" height="18" rx="9"
        fill="#0B1A30" stroke="url(#boxGrad)" stroke-width="2"/>
  <circle cx="640" cy="353" r="4" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- WRENCH -->
  <g transform="translate(540, 400)" filter="url(#glow)">
    <path d="M -4 36 L 14 18 L 10 8 Q 14 -6 26 -8 Q 38 -10 42 0 L 34 8 L 40 14 L 32 20 Q 22 20 18 10 L 4 44 Z"
          fill="none" stroke="#00C896" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- SHIELD -->
  <g transform="translate(618, 378)" filter="url(#glow)">
    <path d="M 22 0 L 44 10 L 44 30 Q 44 50 22 58 Q 0 50 0 30 L 0 10 Z"
          fill="#00C896" opacity="0.12"/>
    <path d="M 22 0 L 44 10 L 44 30 Q 44 50 22 58 Q 0 50 0 30 L 0 10 Z"
          fill="none" stroke="#00C896" stroke-width="2.2"/>
    <polyline points="12,29 20,37 32,21" fill="none" stroke="#00C896" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CODE BRACKETS -->
  <g transform="translate(700, 398)" filter="url(#glow)" fill="none" stroke="#00A8D4" stroke-width="2.5" stroke-linecap="round">
    <polyline points="18,6 6,20 18,34"/>
    <polyline points="30,6 42,20 30,34"/>
    <line x1="24" y1="4" x2="20" y2="36"/>
  </g>

  <!-- MAIN TEXT -->
  <text x="640" y="548"
        font-family="'Courier New', 'Lucida Console', monospace"
        font-size="72"
        font-weight="700"
        letter-spacing="6"
        text-anchor="middle"
        fill="#00C896"
        filter="url(#glow)">SECU<tspan fill="#F5FF3C">TOOLBOX</tspan></text>

  <!-- TAGLINE -->
  <text x="640" y="590"
        font-family="'Courier New', monospace"
        font-size="18"
        letter-spacing="8"
        text-anchor="middle"
        fill="#4A6FA5"
        opacity="0.9">SECURITY · TOOLS · ARSENAL</text>

  <!-- SIDE LINES -->
  <line x1="200" y1="360" x2="460" y2="360" stroke="#1A3050" stroke-width="1" opacity="0.6"/>
  <line x1="820" y1="360" x2="1080" y2="360" stroke="#1A3050" stroke-width="1" opacity="0.6"/>
  <circle cx="460" cy="360" r="3" fill="#00C896" opacity="0.4"/>
  <circle cx="820" cy="360" r="3" fill="#00C896" opacity="0.4"/>

  <!-- CORNER ACCENTS -->
  <g stroke="#00C896" stroke-width="2" fill="none" opacity="0.3">
    <polyline points="40,40 40,70 70,70"/>
    <polyline points="1240,40 1240,70 1210,70"/>
    <polyline points="40,680 40,650 70,650"/>
    <polyline points="1240,680 1240,650 1210,650"/>
  </g>

  <!-- TOP/BOTTOM EDGE LINES -->
  <rect x="0" y="0" width="1280" height="2" fill="#00C896" opacity="0.15"/>
  <rect x="0" y="718" width="1280" height="2" fill="#00C896" opacity="0.15"/>
</svg>
